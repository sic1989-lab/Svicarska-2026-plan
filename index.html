<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Švicarska 2026 — Plan po danima</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F2ED;--surface:#FFFFFF;--text:#1C1C1C;--muted:#6B6863;
  --border:#E2DED7;--accent:#2E5D4B;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */


input[type=search]::placeholder{color:rgba(255,255,255,.38)}
input[type=search]:focus{background:rgba(255,255,255,.22)}

aside::-webkit-scrollbar{width:3px}
aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.dn{
  display:flex;align-items:center;gap:.55rem;padding:.55rem .9rem;
  cursor:pointer;border-left:3px solid transparent;
  border-bottom:1px solid var(--border);transition:all .15s;
}
.dn:hover{background:var(--bg)}
.dn.active{background:#f0f4f2}
.db{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:.68rem;font-weight:700;color:white;flex-shrink:0}
.dl{flex:1;min-width:0}
.dd{font-size:.68rem;color:var(--muted);line-height:1.2}
.dt{font-size:.77rem;font-weight:500;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc{font-size:.68rem;color:var(--muted);background:var(--bg);padding:1px 5px;border-radius:8px;flex-shrink:0}

/* LAYOUT */
.container{display:grid;grid-template-columns:250px 1fr;min-height:100vh;align-items:start;}

/* SIDEBAR */
aside{
  background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;
}
aside::-webkit-scrollbar{width:3px}
aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* MAIN */
main{padding:1.75rem 2rem;}
.day-sec{margin-bottom:3rem;scroll-margin-top:1rem}

.day-hdr{display:flex;align-items:center;gap:.7rem;margin-bottom:1.25rem;padding-bottom:.7rem;border-bottom:2px solid var(--border)}
.day-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'DM Serif Display',serif;font-size:.95rem;color:white;flex-shrink:0}
.day-info{flex:1}
.day-date{font-size:.72rem;color:var(--muted);margin-bottom:.1rem}
.day-title{font-family:'DM Serif Display',serif;font-size:1.15rem;font-weight:400}
.day-night{font-size:.72rem;color:var(--muted);margin-top:.1rem}
.day-night b{color:var(--text);font-weight:500}
.day-cnt{font-size:.72rem;color:var(--muted);background:var(--bg);padding:.18rem .55rem;border-radius:10px}

/* Grupa layout */
.group { margin-bottom: 1.75rem; }
.group-label { font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:.25rem 0 .6rem;margin-bottom:.6rem;border-bottom:1px solid var(--border); }

/* Karta + lista side by side */
.group-body { display:flex; gap:.75rem; align-items:flex-start; }
.group-map-wrap { width:280px; flex-shrink:0; height:220px; border-radius:8px; border:1px solid var(--border); overflow:hidden; position:relative; z-index:0; }
.group-list { flex:1; min-width:0; display:flex; flex-direction:column; gap:.3rem; }

/* Kartica - kompaktan red */
.card { background:var(--surface); border:1px solid var(--border); border-radius:7px; overflow:hidden; transition:all .15s; }
.card:hover { border-color:#aaa; box-shadow:0 2px 8px rgba(0,0,0,.07); }
.card-top { display:flex; align-items:flex-start; gap:.55rem; padding:.55rem .75rem; }
.card-top a, .card-top .no-url { display:flex; align-items:flex-start; gap:.55rem; width:100%; text-decoration:none; color:inherit; }
.card-num { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:700; color:white; flex-shrink:0; margin-top:1px; }
.card-body { flex:1; min-width:0; }
.cname { font-size:.82rem; font-weight:500; line-height:1.3; }
.ctype { font-size:.7rem; color:var(--muted); margin-top:.1rem; }
.card:hover .cname { text-decoration:underline; text-underline-offset:2px; }

/* Info box - kompaktniji */
.info-box { margin:0 .75rem .55rem; background:#f8f7f4; border:1px solid var(--border); border-radius:6px; padding:.45rem .65rem; font-size:.73rem; line-height:1.5; }
.info-row { display:flex; gap:.4rem; margin-bottom:.18rem; align-items:flex-start; }
.info-row:last-child { margin-bottom:0; }
.info-lbl { color:var(--muted); flex-shrink:0; width:58px; font-size:.68rem; padding-top:.05rem; }
.info-val { color:var(--text); flex:1; }
.info-val a { color:#1a6b4a; text-decoration:none; font-weight:500; }
.info-val a:hover { text-decoration:underline; }
.warn { color:#b45309; font-weight:500; }
.ok { color:#166534; }

/* Bez karte - puni width */
.group-body.no-map .group-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:.3rem; }

/* Responsive */
@media(max-width:800px) {
  .group-body { flex-direction:column; }
  .group-map-wrap { width:100%; }
  .group-body.no-map .group-list { grid-template-columns:1fr; }
}


.hidden{display:none!important}
.day-sec.sh{display:none}

@media(max-width:680px){
  body { overflow-x:hidden; }
  .container{ display:block; }
  aside{
    position:fixed;
    top:0; left:0; right:0;
    z-index:998;
    height:auto; border-right:none; border-bottom:1px solid var(--border);
    display:flex; overflow-x:auto; overflow-y:hidden;
    padding:.3rem 0;
    background:var(--surface);
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  aside::-webkit-scrollbar{display:none}
  main{ padding-top: calc(var(--aside-h, 60px) + .5rem); }
  .dn{flex-direction:column;align-items:center;text-align:center;padding:.4rem .55rem;
    min-width:60px;border-left:none;border-bottom:3px solid transparent;border-right:1px solid var(--border)}
  .dl,.dc{display:none}
  header,main{padding-left:1rem;padding-right:1rem}
  main{overflow-y:visible;height:auto;}
  .group-map-wrap{height:160px;}
  .wx-bar{flex-wrap:wrap;}
  .wx-day{min-width:80px;}
}



.wx-bar { display:flex; gap:.35rem; background:linear-gradient(135deg,#e8f4fd,#d4eaf7); border:1px solid #b8d4e8; border-radius:7px; padding:.4rem .5rem; margin:.3rem 0 .6rem; font-size:.72rem; }
.wx-day { flex:1; text-align:center; background:rgba(255,255,255,.6); border-radius:5px; padding:.2rem .25rem; }
.wx-label { font-weight:600; color:#1a5276; font-size:.67rem; margin-bottom:.1rem; }
.wx-icon { font-size:1.1rem; line-height:1.4; }
.wx-desc { color:#2c6e9e; font-size:.63rem; }
.wx-temp { display:flex; justify-content:center; gap:.25rem; font-weight:600; margin-top:.15rem; }
.wx-hi { color:#c0392b; }
.wx-lo { color:#2980b9; }
.wx-prec { color:#7f8c8d; font-size:.62rem; margin-top:.05rem; }

function buildMiniMap(groupLabel, color, container) {
  const pts = GROUP_COORDS[groupLabel];
  if (!pts || pts.length === 0) return;

  const id = 'map-' + Math.random().toString(36).slice(2);
  const wrap = document.createElement('div');
  wrap.id = id;
  wrap.style.cssText = 'height:200px;border-radius:8px;margin-bottom:.75rem;border:1px solid var(--border);overflow:hidden;z-index:0;position:relative';
  container.insertBefore(wrap, container.firstChild);

  // Lazy init — IntersectionObserver da ne inicijaliziramo sve karte odjednom
  const obs = new IntersectionObserver((entries) => {
    if (!entries[0].isIntersecting) return;
    obs.disconnect();

    const map = L.map(id, {
      zoomControl: true,
      scrollWheelZoom: false,
      attributionControl: false,
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OSM'
    }).addTo(map);

    L.control.attribution({prefix: false}).addTo(map);

    const markers = pts.map((p, i) => {
      const icon = L.divIcon({
        className: '',
        html: `<div style="background:${color};color:white;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.3);font-family:DM Sans,sans-serif">${i+1}</div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11],
      });
      return L.marker([p.lat, p.lng], {icon})
        .addTo(map)
        .bindTooltip(p.name, {permanent: false, direction: 'top', offset: [0, -12]});
    });

    if (pts.length === 1) {
      map.setView([pts[0].lat, pts[0].lng], 14);
    } else {
      const group = L.featureGroup(markers);
      map.fitBounds(group.getBounds().pad(0.25));
    }

    // Isprekidana linija između točaka
    if (pts.length > 1) {
      const latlngs = pts.map(p => [p.lat, p.lng]);
      L.polyline(latlngs, {color, weight: 2, dashArray: '6,5', opacity: 0.7}).addTo(map);
    }

    _maps[id] = map;
  }, {threshold: 0.1});

  obs.observe(wrap);
}

function getType(name) {
  const n = name.toLowerCase();
  if (/hotel|ibis|apart|gasthaus|mondschein|miragolf|résidence|residence|deux gares|blue sky|camping|smještaj|bèla/.test(n)) return '🏨 Smještaj';
  if (/ristorante|pizzeria|stübli|kiosque|batzen|ochette|rössl/.test(n)) return '🍽️ Restoran';
  if (/lidl|aldi|spar|eurospar/.test(n)) return '🛒 Shopping';
  if (/grand tour|photospot on the grand/.test(n)) return '📸 Foto spot';
  if (/parkplatz|parking/.test(n)) return '🅿️ Parking';
  if (/museum|castel|château|fort de chillon|kathedrale|arsenal|schatzkammer|kunstmuseum|einstein|bahnmuseum|schellenursli|olympi|south tyrol|sforzesco|cenacolo|da vinci/.test(n)) return '🏛️ Kultura';
  if (/waterfall|gorge|rothorn|lac souterrain|mont-blanc|riffelsee|giessbach|reichenbach|aare gorge|stelvio|männlichen|schilthorn|birg|gimmelwald|allmendhubel|mürren|berglist|brienzer/.test(n)) return '🏔️ Priroda';
  return '📍 Atrakcija';
}

function buildCard(p, color, num) {
  const info = INFO[p.name];
  const type = getType(p.name);
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.name = p.name.toLowerCase();

  const numBadge = num != null
    ? `<div class="card-num" style="background:${color}">${num}</div>`
    : `<div class="dot" style="background:${color};width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px"></div>`;

  const inner = p.url
    ? `<a href="${p.url}" target="_blank" rel="noopener">${numBadge}<div class="card-body"><div class="cname">${p.name}</div><div class="ctype">${type}</div></div></a>`
    : `<div class="no-url">${numBadge}<div class="card-body"><div class="cname">${p.name}</div><div class="ctype">${type}</div></div></div>`;

  let infoHTML = '';
  if (info) {
    const tipCls = info.tip === '⚠️' ? 'warn' : 'ok';
    infoHTML = `<div class="info-box">
      <div class="info-row"><span class="info-lbl">Web</span><span class="info-val"><a href="${info.web}" target="_blank" rel="noopener">${info.web.replace('https://','')}</a></span></div>
      <div class="info-row"><span class="info-lbl">Radno</span><span class="info-val">${info.radno}</span></div>
      <div class="info-row"><span class="info-lbl">Cijena</span><span class="info-val">${info.cijena}</span></div>
      <div class="info-row"><span class="info-lbl">Napomena</span><span class="info-val ${tipCls}">${info.napomena}</span></div>
    </div>`;
  }

  card.innerHTML = `<div class="card-top">${inner}</div>${infoHTML}`;
  return card;
}

function buildDay(day) {
  const sec = document.createElement('div');
  sec.className = 'day-sec';
  sec.id = 'day-' + day.dan;
  sec.dataset.dan = day.dan;

  sec.innerHTML = `<div class="day-hdr">
    <div class="day-circle" style="background:${day.boja}">D${day.dan}</div>
    <div class="day-info">
      <div class="day-date">${day.datum}</div>
      <div class="day-title">${day.naslov}</div>
      <div class="day-night">Noćenje: <b>${day.noc}</b></div>
    </div>
    ${day.mjesta.length > 0 ? `<span class="day-cnt">${day.mjesta.length} mjesta</span>` : ''}
  </div>`;

  const groups = GROUPS[day.dan];
  const placed = new Set();

  if (groups) {
    groups.forEach(g => {
      if (g.names.length === 0) return;

      const gDiv = document.createElement('div');
      gDiv.className = 'group';

      const lbl = document.createElement('div');
      lbl.className = 'group-label';
      lbl.textContent = g.label;
      gDiv.appendChild(lbl);

      // Koordinate za ovu grupu — samo ona mjesta koja su u g.names I imaju koordinate
      const coords = GROUP_COORDS[g.label] || [];
      // Kreiraj mapu: name -> index (1-based) prema redoslijedu u coords
      const numMap = {};
      coords.forEach((c, i) => { numMap[c.name] = i + 1; });

      const hasMap = coords.length > 0;
      const body = document.createElement('div');
      body.className = 'group-body' + (hasMap ? '' : ' no-map');

      // Karta
      if (hasMap) {
        const mapId = 'lmap-' + Math.random().toString(36).slice(2,8);
        const mapWrap = document.createElement('div');
        mapWrap.className = 'group-map-wrap';
        mapWrap.id = mapId;
        body.appendChild(mapWrap);

        const obs = new IntersectionObserver((entries) => {
          if (!entries[0].isIntersecting) return;
          obs.disconnect();
          if (typeof L === 'undefined') return;
          const map = L.map(mapId, {zoomControl:true, scrollWheelZoom:false, attributionControl:true});
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom:19, attribution:'© <a href="https://openstreetmap.org">OSM</a>'
          }).addTo(map);
          const markers = coords.map((c, i) => {
            const icon = L.divIcon({
              className:'',
              html:`<div style="background:${day.boja};color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font-family:sans-serif">${i+1}</div>`,
              iconSize:[22,22], iconAnchor:[11,11]
            });
            return L.marker([c.lat,c.lng],{icon}).addTo(map)
              .bindTooltip(c.name,{permanent:false,direction:'top',offset:[0,-13]});
          });
          if (coords.length === 1) {
            map.setView([coords[0].lat,coords[0].lng], 14);
          } else {
            map.fitBounds(L.featureGroup(markers).getBounds().pad(0.3));
          }
          if (coords.length > 1) {
            L.polyline(coords.map(c=>[c.lat,c.lng]),{color:day.boja,weight:2,dashArray:'6 5',opacity:0.65}).addTo(map);
          }
        }, {threshold:0.1});
        obs.observe(mapWrap);
      }

      // Lista kartica
      const list = document.createElement('div');
      list.className = 'group-list';

      g.names.forEach(name => {
        const p = day.mjesta.find(m => m.name === name);
        if (p) {
          const num = numMap[name] ?? null;
          list.appendChild(buildCard(p, day.boja, num));
          placed.add(name);
        }
      });

      if (list.children.length > 0) {
        body.appendChild(list);
        gDiv.appendChild(body);
        sec.appendChild(gDiv);
        // Prognoza — dodaj nakon što je gDiv u DOM-u
        if (hasMap) {
          const cLat = coords.reduce((s,c)=>s+c.lat,0)/coords.length;
          const cLng = coords.reduce((s,c)=>s+c.lng,0)/coords.length;
          const wxEl = document.createElement('div');
          gDiv.insertBefore(wxEl, gDiv.querySelector('.group-body'));
          fetchWeather(cLat, cLng, wxEl);
        }
      }
    });
  }

  // Negrupirani ostatak
  const rest = day.mjesta.filter(m => !placed.has(m.name));
  if (rest.length > 0) {
    const gDiv = document.createElement('div');
    gDiv.className = 'group';
    if (placed.size > 0) {
      const lbl = document.createElement('div');
      lbl.className = 'group-label';
      lbl.textContent = 'Ostalo';
      gDiv.appendChild(lbl);
    }
    const body = document.createElement('div');
    body.className = 'group-body no-map';
    const list = document.createElement('div');
    list.className = 'group-list';
    rest.forEach(p => list.appendChild(buildCard(p, day.boja, null)));
    body.appendChild(list);
    gDiv.appendChild(body);
    sec.appendChild(gDiv);
  }

  if (day.mjesta.length === 0) {
    sec.innerHTML += '<div class="empty">Nema spremljenih mjesta za ovaj dan</div>';
  }
  return sec;
}

function buildUI() {
  const sidebar = document.getElementById('sidebar');
  const mainEl = document.getElementById('main');
  plan.forEach((day, i) => {
    // Sidebar
    const nav = document.createElement('div');
    nav.className = 'dn' + (i===0?' active':'');
    nav.dataset.dan = day.dan;
    nav.style.borderLeftColor = i===0 ? day.boja : 'transparent';
    nav.innerHTML = `<div class="db" style="background:${day.boja}">D${day.dan}</div>
      <div class="dl"><div class="dd">${day.datum}</div><div class="dt">${day.naslov}</div></div>
      <span class="dc">${day.mjesta.length}</span>`;
    nav.onclick = () => {
      document.getElementById('day-'+day.dan).scrollIntoView({behavior:'smooth',block:'start'});
      setActive(day.dan, day.boja);
    };
    sidebar.appendChild(nav);
    mainEl.appendChild(buildDay(day));
  });

  // Scroll spy
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const d = plan.find(x => x.dan == e.target.dataset.dan);
        if (d) { setActive(d.dan, d.boja); }
      }
    });
  }, {threshold:0.2});
  document.querySelectorAll('.day-sec').forEach(s => obs.observe(s));

  // Auto-pozicioniraj na današnji ili prvi sljedeći dan
  autoScrollToday();
}

function parseDate(datumStr) {
  // Format: "Pet 12.6." ili "Sub 13.6." itd.
  const m = datumStr.match(/(\d+)\.(\d+)\./);
  if (!m) return null;
  const day = parseInt(m[1]), month = parseInt(m[2]);
  return new Date(2026, month - 1, day);
}

function autoScrollToday() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  // Pronađi današnji dan ili prvi sljedeći
  let target = null;
  for (const day of plan) {
    const d = parseDate(day.datum);
    if (!d) continue;
    if (d >= today) {
      target = day;
      break;
    }
  }

  // Ako nema budućih dana, uzmi zadnji
  if (!target) target = plan[plan.length - 1];
  if (!target) return;

  // Scroll sidebar na taj dan
  setActive(target.dan, target.boja);

  // Scroll main na taj dan (kratka odgoda da se DOM renderira)
  setTimeout(() => {
    const el = document.getElementById('day-' + target.dan);
    if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
  }, 100);
}


function setActive(dan, boja) {
  document.querySelectorAll('.dn').forEach(el => {
    const active = el.dataset.dan == dan;
    el.classList.toggle('active', active);
    el.style.borderLeftColor = active ? boja : 'transparent';
    if (active) el.scrollIntoView({block:'nearest'});
  });
}

function doSearch() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  let vis = 0;
  document.querySelectorAll('.day-sec').forEach(sec => {
    let any = false;
    sec.querySelectorAll('.card').forEach(c => {
      const m = !q || c.dataset.name.includes(q);
      c.classList.toggle('hidden', !m);
      if (m) { any=true; vis++; }
    });
    sec.classList.toggle('sh', !any && sec.querySelector('.card'));
  });
  document.getElementById('vis-count').textContent = q ? vis+' rezultata' : '';
}

function wmoDesc(code) {
  if (code === 0) return ['☀️', 'Vedro'];
  if (code <= 2) return ['⛅', 'Dj. oblačno'];
  if (code === 3) return ['☁️', 'Oblačno'];
  if (code <= 49) return ['🌫️', 'Magla'];
  if (code <= 59) return ['🌦️', 'Rosulja'];
  if (code <= 69) return ['🌧️', 'Kiša'];
  if (code <= 79) return ['🌨️', 'Snijeg'];
  if (code <= 84) return ['🌦️', 'Pljuskovi'];
  return ['⛈️', 'Grmljavina'];
}

async function fetchWeather(lat, lng, el) {
  try {
    const u = 'https://wttr.in/' + lat.toFixed(4) + ',' + lng.toFixed(4) + '?format=j1';
    const r = await fetch(u);
    const data = await r.json();
    const days = ['Danas','Sutra','Prekosutra'];
    el.innerHTML = '<div class="wx-bar">' + days.map((day, i) => {
      const w = data.weather[i];
      const desc = w.hourly[4].weatherDesc[0].value;
      const tmax = w.maxtempC;
      const tmin = w.mintempC;
      const prec = w.hourly.reduce((s,h) => s + Number(h.precipMM), 0).toFixed(1);
      const code = Number(w.hourly[4].weatherCode);
      const icon = code === 113 ? '☀️' : code <= 116 ? '⛅' : code <= 119 ? '☁️' :
                   code <= 143 ? '🌫️' : code <= 176 ? '🌦️' : code <= 185 ? '🌧️' :
                   code <= 260 ? '🌨️' : code <= 299 ? '🌦️' : code <= 399 ? '🌧️' : '⛈️';
      return '<div class="wx-day">'
        + '<div class="wx-label">' + day + '</div>'
        + '<div class="wx-icon">' + icon + '</div>'
        + '<div class="wx-desc">' + desc.substring(0,12) + '</div>'
        + '<div class="wx-temp"><span class="wx-hi">' + tmax + '°</span><span class="wx-lo">' + tmin + '°</span></div>'
        + '<div class="wx-prec">💧 ' + prec + 'mm</div>'
        + '</div>';
    }).join('') + '</div>';
  } catch(e) {
    el.innerHTML = '';
  }
}


buildUI();

// Postavi CSS varijable za visine na mobitelu
function setMobileHeights() {
  const header = document.querySelector('header');
  const aside = document.getElementById('sidebar');
  if (!header || !aside) return;
  const hh = header.getBoundingClientRect().height;
  const ah = aside.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--header-h', hh + 'px');
  document.documentElement.style.setProperty('--aside-h', ah + 'px');
}
setMobileHeights();
window.addEventListener('resize', setMobileHeights);
